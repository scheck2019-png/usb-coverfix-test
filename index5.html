<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB CoverFix Deluxe – Brutal Final</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI;}
body{
background:radial-gradient(circle,#10151c,#05070a);
color:#fff;overflow-x:hidden;
}

/* HEADER */
header{
display:flex;justify-content:space-between;align-items:center;
padding:20px 30px;
}
h1{
font-size:32px;
background:linear-gradient(90deg,#00ff99,#00ccff,#ffee00);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* BUTTONS */
.btn{
padding:12px 24px;border:none;border-radius:30px;
cursor:pointer;font-weight:bold;
}
.green{background:#00ff99;color:#000;}
.gold{background:#ffb300;color:#000;}

/* HERO */
.hero{
text-align:center;padding:40px 20px;
}
.hero h2{font-size:40px;margin-bottom:10px;}
.hero p{opacity:.8;margin-bottom:20px;}

.container{max-width:1200px;margin:auto;padding:20px;}

.features{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;margin-top:30px;
}
.card{
background:rgba(255,255,255,.05);
padding:20px;border-radius:20px;
transition:.3s;
}
.card:hover{transform:translateY(-8px);}

/* FAIRY */
#fairy{
position:fixed;
font-size:40px;
left:100px;top:100px;
z-index:9999;
pointer-events:none;
}

/* SPARK */
.spark{
position:fixed;width:6px;height:6px;
background:#fff;border-radius:50%;
animation:fade .8s forwards;
}
@keyframes fade{
0%{opacity:1}
100%{opacity:0;transform:translateY(-20px);}
}

/* MODAL */
#modal{
position:fixed;top:50%;left:50%;
transform:translate(-50%,-50%);
background:#111;padding:20px;
border-radius:20px;
display:none;
z-index:10000;
}

/* TOGGLE */
.toggle{
position:fixed;bottom:20px;right:20px;
cursor:pointer;font-size:22px;
}
</style>
</head>

<body>

<header>
<h1>USB CoverFix Deluxe</h1>
<div>
<button class="btn green" onclick="download()">Download</button>
<button class="btn gold" onclick="buy()">Kaufen 19,90€</button>
</div>
</header>

<section class="hero">
<h2>🔥 Brutal Cover Lösung</h2>
<p>Automatische MP3 Cover für USB & Autoradio</p>
</section>

<div class="container">
<div class="features">
<div class="card">🎵 MP3 Batch</div>
<div class="card">🚗 Autoradio ready</div>
<div class="card">⚡ Schnell</div>
<div class="card">🧚 Fairy AI</div>
</div>
</div>

<div id="fairy">🧚</div>
<div id="modal"></div>
<div class="toggle" onclick="toggleTheme()">🌙</div>

<script>

/* FAIRY FOLLOW */
let fx=100,fy=100;
let tx=300,ty=200;

document.addEventListener("mousemove",e=>{
tx=e.clientX;ty=e.clientY;
});

function fairy(){
fx+=(tx-fx)*0.08;
fy+=(ty-fy)*0.08;
fairyEl.style.left=fx+"px";
fairyEl.style.top=fy+"px";
spark(fx,fy);
requestAnimationFrame(fairy);
}
const fairyEl=document.getElementById("fairy");
fairy();

/* SPARK */
function spark(x,y){
let s=document.createElement("div");
s.className="spark";
s.style.left=x+"px";
s.style.top=y+"px";
document.body.appendChild(s);
setTimeout(()=>s.remove(),800);
}

/* MODAL */
function show(msg){
let m=document.getElementById("modal");
m.innerHTML=msg;
m.style.display="block";
setTimeout(()=>m.style.display="none",2000);
}

/* BUTTONS */
function download(){
show("⬇ Download startet...");
}
function buy(){
show("💎 Weiterleitung zum Kauf...");
}

/* THEME */
function toggleTheme(){
document.body.style.background=
document.body.style.background.includes("10151c")
?"#fff":"radial-gradient(circle,#10151c,#05070a)";
}

/* EASTER EGG */
let code="";
window.addEventListener("keydown",e=>{
code+=e.key;
if(code.includes("unicorn")){
alert("🦄 SECRET UNICORN!");
code="";
}
if(code.length>20)code="";
});

</script>

</body>
</html>
